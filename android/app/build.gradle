apply plugin: 'com.android.application'

// The upload key for Google Play (Play App Signing holds the key the app is
// actually signed with; this one only proves an upload is ours). It is read
// from android/keystore.properties, which is gitignored:
//
//   storeFile=/absolute/path/to/redstring-upload.jks
//   storePassword=...
//   keyAlias=upload
//   keyPassword=...
//
// or from REDSTRING_UPLOAD_STORE_FILE / _STORE_PASSWORD / _KEY_ALIAS /
// _KEY_PASSWORD in the environment. Debug builds never need it.
def uploadProps = new Properties()
def uploadPropsFile = rootProject.file('keystore.properties')
if (uploadPropsFile.exists()) uploadPropsFile.withInputStream { uploadProps.load(it) }
def upload = { String key, String env -> uploadProps.getProperty(key) ?: System.getenv(env) }
def uploadStoreFile = upload('storeFile', 'REDSTRING_UPLOAD_STORE_FILE')

android {
    namespace "io.redstring.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.redstring.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1501099
        versionName "0.15.10"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (uploadStoreFile) {
                storeFile rootProject.file(uploadStoreFile)
                storePassword upload('storePassword', 'REDSTRING_UPLOAD_STORE_PASSWORD')
                keyAlias upload('keyAlias', 'REDSTRING_UPLOAD_KEY_ALIAS')
                keyPassword upload('keyPassword', 'REDSTRING_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (uploadStoreFile) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Declared rather than inherited: MainActivity compiles against WindowCompat
    // and WindowInsetsControllerCompat to go fullscreen, and a compile-time API
    // should not ride in transitively off capacitor-android. The version was
    // already sitting unused in variables.gradle waiting for this.
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// An unsigned release bundle is useless to Play and easy to upload by mistake,
// so a release build without the upload key stops here, saying what's missing.
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { it.project == project && it.name ==~ /(bundle|assemble)Release/ }
    if (wantsRelease && !uploadStoreFile) {
        throw new GradleException("No upload key for the release build. Create android/keystore.properties " +
            "(see the top of android/app/build.gradle) or set REDSTRING_UPLOAD_STORE_FILE and the other REDSTRING_UPLOAD_* variables.")
    }
}
