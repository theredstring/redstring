<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- viewport-fit=cover lets the page paint into the safe areas (Dynamic
       Island / notch, home indicator). <body> then holds those areas as padding
       so the app's own layout box is unchanged, and the bands show the page
       background rather than the opaque native web-view background. On any
       display without insets env(safe-area-inset-*) is 0 and nothing changes. -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
  <title>Redstring</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
