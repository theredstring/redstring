# ─────────────────────────────────────────────────────────────────────────────
# LEGACY — retired; see the maintainer runbook.
# Redstring now ships via Cloudflare Pages. This Cloud Build config deploys a
# public (--allow-unauthenticated) Cloud Run service. Its first step fails
# unless the build is submitted with --substitutions=_ALLOW_LEGACY_GCP=1.
# ─────────────────────────────────────────────────────────────────────────────
steps:
  # Refuse to run unless explicitly opted in (retired infrastructure).
  - name: 'bash'
    entrypoint: 'bash'
    args: ['-c', 'if [ "$_ALLOW_LEGACY_GCP" != "1" ]; then echo "Refusing: retired GCP deployment. See the maintainer runbook" >&2; exit 1; fi']
    id: 'legacy-guard'

  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '-f', 'oauth-app.Dockerfile',
      '-t', 'gcr.io/$PROJECT_ID/redstring-oauth-app:latest',
      '.'
    ]
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/redstring-oauth-app:latest']

substitutions:
  _ALLOW_LEGACY_GCP: '0'
