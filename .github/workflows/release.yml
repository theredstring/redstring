name: Build/Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Least privilege: read-only by default; only the release job may write
# (electron-builder uploads the artifacts to the tag's GitHub release).
permissions:
  contents: read

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      # One platform's failure shouldn't cancel the other two — a macOS OOM took
      # the Linux and Windows builds down with it on the first v0.11.0 attempt,
      # so the run reported nothing about whether they would have succeeded.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    # macOS builds both architectures in this one job, serially, and writes a
    # single latest-mac.yml describing all four artifacts. Splitting the arches
    # into concurrent jobs to overlap the ~3.5min notarization waits was tried
    # and reverted: `--mac --x64` does NOT restrict architecture when
    # electron-builder.json declares `arch: ["x64", "arm64"]` on the targets —
    # the config wins — so both jobs built all four artifacts, took 11m and 13m
    # respectively (slower than the 11m12s single job), and produced two
    # conflicting manifests whose merge shipped one build's hashes against
    # another build's bytes. Any future attempt must restrict arch via CLI
    # target:arch pairs (`--mac dmg:arm64 zip:arm64`) and be verified by
    # inspecting the artifact contents, not the flag's intent.

    steps:
      # Every action is pinned to a full commit SHA (tags can be moved); the
      # comment records which release that SHA is.
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version:         $TAG_VERSION"
          echo "package.json version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION. Refusing to build."
            exit 1
          fi

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # electron-builder 26.x sends the CERTIFICATE's password to
      # `security set-key-partition-list -k`, which wants the KEYCHAIN's. macOS
      # 26.5 accepted the wrong one silently; the 20260828.587 runner image
      # (macOS 26.6) exits 1 on it and took the v0.13.0 release down, five days
      # after v0.12.2 built on the same macos-26-arm64 label. Fixed upstream in
      # 27.0.0-alpha only, so patch it here until 27 is stable. The script
      # no-ops on 27+ and fails the job if it can't apply.
      - name: Patch electron-builder keychain password (macOS)
        if: runner.os == 'macOS'
        run: node scripts/patch-electron-builder-keychain.mjs

      # Windows releases must be Authenticode-signed: electron-updater verifies
      # the publisher of every downloaded update (verifyUpdateCodeSignature),
      # and an unsigned installer is the easiest thing to substitute. Refuse to
      # build without the certificate unless the repo variable
      # ALLOW_UNSIGNED_WINDOWS is explicitly 'true'.
      - name: Require Windows code-signing certificate
        if: runner.os == 'Windows'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          ALLOW_UNSIGNED_WINDOWS: ${{ vars.ALLOW_UNSIGNED_WINDOWS }}
        run: |
          if [ -z "$WIN_CSC_LINK" ]; then
            if [ "$ALLOW_UNSIGNED_WINDOWS" = "true" ]; then
              echo "::warning::WIN_CSC_LINK is not set; building an UNSIGNED Windows release (ALLOW_UNSIGNED_WINDOWS=true)."
            else
              echo "::error::WIN_CSC_LINK secret is not set. Add the Windows code-signing certificate (base64 .pfx) as WIN_CSC_LINK and its password as WIN_CSC_KEY_PASSWORD, or set the repo variable ALLOW_UNSIGNED_WINDOWS=true to ship unsigned."
              exit 1
            fi
          fi

      # Vite's sourcemap generation is the memory ceiling on this build: the
      # main chunk is ~3.2MB and its map ~12.5MB, and producing that lot
      # peaks around 2.8GB RSS. The macOS arm64 runner has 7GB, so Node 20
      # sizes its old-space heap at roughly 2GB by default — which v0.10.2
      # fit under and v0.11.0 does not. Raise it rather than shrink the
      # build, so releases don't fail on the next few hundred KB either.
      - name: Build renderer
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # GitHub Device Flow client IDs — public values inlined into the
          # Electron renderer at build time so the desktop app can do
          # GitHub OAuth without contacting redstring.io. The desktop App
          # slug is constant so it's literal here; falls back to the
          # default in src/services/githubDeviceFlow.js if unset.
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          VITE_GITHUB_APP_CLIENT_ID: ${{ secrets.VITE_GITHUB_APP_CLIENT_ID }}
          VITE_GITHUB_APP_SLUG: ${{ secrets.VITE_GITHUB_APP_SLUG }}

      - name: Bundle agent server
        run: npm run bundle:agent

      # electron-builder directly (no third-party wrapper action). Uploads to
      # the tag's GitHub release, which electron-builder creates as a draft.
      - name: Build and publish (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple Notarization
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Code Signing (Developer ID Application)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build and publish (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          EXTRA=()
          # Pin the publisher electron-updater checks updates against, when
          # known; otherwise electron-builder takes the certificate's CN.
          if [ -n "$WIN_PUBLISHER_NAME" ]; then
            EXTRA+=("-c.win.signtoolOptions.publisherName=$WIN_PUBLISHER_NAME")
          fi
          npx electron-builder --win --publish always "${EXTRA[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows signing uses its own certificate — never the macOS one.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME }}

      - name: Build and publish (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The fuses are what make the packaged app refuse ELECTRON_RUN_AS_NODE,
      # NODE_OPTIONS, --inspect and a swapped app.asar. Check the binaries that
      # were actually built. (Artifacts go up as a draft release: a red job here
      # means do not publish that draft.)
      - name: Assert Electron fuses are flipped
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS)   APPS=$(find dist-electron -maxdepth 2 -name 'Redstring.app' -type d) ;;
            Windows) APPS=$(find dist-electron -maxdepth 2 -path '*win-unpacked*' -name 'Redstring.exe') ;;
            Linux)   APPS=$(find dist-electron/linux-unpacked -maxdepth 1 -type f -perm -u+x -name 'redstring*' ! -name '*.so*') ;;
          esac
          if [ -z "$APPS" ]; then echo "::error::No packaged app found to check fuses on"; exit 1; fi
          while IFS= read -r APP; do
            echo "Checking fuses in $APP"
            OUT=$(npx @electron/fuses read --app "$APP")
            echo "$OUT"
            for EXPECT in \
              "RunAsNode is Disabled" \
              "EnableCookieEncryption is Enabled" \
              "EnableNodeOptionsEnvironmentVariable is Disabled" \
              "EnableNodeCliInspectArguments is Disabled" \
              "EnableEmbeddedAsarIntegrityValidation is Enabled" \
              "OnlyLoadAppFromAsar is Enabled" \
              "GrantFileProtocolExtraPrivileges is Disabled"; do
              if ! grep -qF "$EXPECT" <<<"$OUT"; then
                echo "::error::$APP: expected '$EXPECT'"
                exit 1
              fi
            done
          done <<<"$APPS"
