name: Build/Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform's failure shouldn't cancel the other two — a macOS OOM took
      # the Linux and Windows builds down with it on the first v0.11.0 attempt,
      # so the run reported nothing about whether they would have succeeded.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    # macOS builds both architectures in this one job, serially, and writes a
    # single latest-mac.yml describing all four artifacts. Splitting the arches
    # into concurrent jobs to overlap the ~3.5min notarization waits was tried
    # and reverted: `--mac --x64` does NOT restrict architecture when
    # electron-builder.json declares `arch: ["x64", "arm64"]` on the targets —
    # the config wins — so both jobs built all four artifacts, took 11m and 13m
    # respectively (slower than the 11m12s single job), and produced two
    # conflicting manifests whose merge shipped one build's hashes against
    # another build's bytes. Any future attempt must restrict arch via CLI
    # target:arch pairs (`--mac dmg:arm64 zip:arm64`) and be verified by
    # inspecting the artifact contents, not the flag's intent.

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version:         $TAG_VERSION"
          echo "package.json version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION. Refusing to build."
            exit 1
          fi

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bundle agent server
        run: npm run bundle:agent

      - name: Build and Release
        uses: samuelmeuli/action-electron-builder@v1
        env:
          # Vite's sourcemap generation is the memory ceiling on this build: the
          # main chunk is ~3.2MB and its map ~12.5MB, and producing that lot
          # peaks around 2.8GB RSS. The macOS arm64 runner has 7GB, so Node 20
          # sizes its old-space heap at roughly 2GB by default — which v0.10.2
          # fit under and v0.11.0 does not. Raise it rather than shrink the
          # build, so releases don't fail on the next few hundred KB either.
          NODE_OPTIONS: --max-old-space-size=4096
          # Apple Notarization
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Code Signing
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # GitHub Device Flow client IDs — public values inlined into the
          # Electron renderer at build time so the desktop app can do
          # GitHub OAuth without contacting redstring.io. The desktop App
          # slug is constant so it's literal here; falls back to the
          # default in src/services/githubDeviceFlow.js if unset.
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          VITE_GITHUB_APP_CLIENT_ID: ${{ secrets.VITE_GITHUB_APP_CLIENT_ID }}
          VITE_GITHUB_APP_SLUG: ${{ secrets.VITE_GITHUB_APP_SLUG }}
        with:
          # GitHub token, automatically provided to the action
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release: true
